services:
  naive-caddy:
    image: tankrose/naive-caddy:${CADDY_VERSION}-forwardproxy-${FORWARDPROXY_RELEASE}
    container_name: naive-caddy
    restart: unless-stopped

    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data

    environment:
      - TZ=${TZ}
      - TLS_EMAIL=${TLS_EMAIL}
      - PROXY_DOMAIN=${DOMAIN_1}
      - FALLBACK_HOST=${FALLBACK_HOST}
      - AUTH_USERNAME=${PROXY_USER}
      - AUTH_PASSWORD=${PROXY_PASS}